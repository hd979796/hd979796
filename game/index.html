<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우당탕탕 요절복통</title>
<meta name="description" content="참석자 기록, 바를 정(正) 패배 보드, 랜덤 리그 대진표, 오늘 입금액 정산">
<meta name="theme-color" content="#ff6b35">
<style>
:root{
  --bg:#fff8ef; --card:#ffffff; --ink:#2b2118; --muted:#8a7a6a; --line:#f0e2d0;
  --brand:#ff6b35; --brand2:#ffc93c; --blue:#2f7cf6; --orange:#ff8a00; --red:#e5383b; --green:#1f9d55;
  --radius:16px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.wrap{max-width:760px;margin:0 auto;padding:12px 16px 80px}
button{font:inherit;border:0;border-radius:12px;padding:10px 14px;cursor:pointer;background:#f3e9dc;color:var(--ink);font-weight:600}
button:active{transform:scale(.97)}
button.primary{background:var(--brand);color:#fff}
button.ghost{background:transparent;border:1px solid var(--line)}
button.small{padding:6px 10px;font-size:14px;border-radius:10px}
button:disabled{opacity:.4}
input,select{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);min-width:0}
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin:14px 0;box-shadow:0 2px 0 var(--line)}
h2{font-size:19px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
h3{font-size:16px;margin:14px 0 8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted);font-size:14px}
.hidden{display:none!important}

/* hero */
.hero{border-radius:22px;overflow:hidden;margin-top:4px;box-shadow:0 4px 0 #e9d3b8}
.hero svg{display:block;width:100%;height:auto}

/* calendar */
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.cal-head b{font-size:18px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{text-align:center;font-size:13px;color:var(--muted);padding:4px 0}
.cal .dow:first-child{color:var(--red)} .cal .dow:last-child{color:var(--blue)}
.day{aspect-ratio:1/1;border-radius:12px;background:#fbf4ea;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:600;position:relative;padding:0;font-size:15px}
.day.empty{background:transparent;pointer-events:none}
.day.today{background:var(--brand);color:#fff;box-shadow:0 0 0 3px #ffd9c7}
.day.sel{outline:3px solid var(--brand2)}
.day .cnt{font-size:10px;font-weight:700;color:var(--brand);line-height:1}
.day.today .cnt{color:#fff}
.day.sun{color:var(--red)} .day.sat{color:var(--blue)}
.day.today.sun,.day.today.sat{color:#fff}

/* players */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:#fff3e0;border:1px dashed #f5c48f;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:600}
.rate{display:flex;gap:6px;flex-wrap:wrap}
.rate button.on{background:var(--ink);color:#fff}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:14px;height:4px;border-radius:2px;vertical-align:middle;margin-right:4px}

.board{display:grid;gap:10px}
.pl{border:2px solid var(--line);border-radius:14px;padding:12px;background:#fffdf9}
.pl-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pl-name{font-size:18px;font-weight:800}
.pl-sum{font-weight:800;color:var(--brand);font-variant-numeric:tabular-nums}
.tally{display:flex;flex-wrap:wrap;gap:4px;min-height:44px;margin:8px 0;padding:6px;border-radius:10px;background:repeating-linear-gradient(0deg,#fff,#fff 21px,#f6ecdf 22px)}
.tally svg{width:40px;height:40px}
.tally .none{color:var(--muted);font-size:13px;align-self:center;padding-left:4px}
.pl-btns{display:grid;grid-template-columns:1fr 1fr auto;gap:6px}
.pl-btns .lose{background:#e8f0ff;color:#1c4fb8}
.pl-btns .dbl{background:#ffe5e5;color:#b3261e}

/* league */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick label{display:flex;align-items:center;gap:6px;background:#fbf4ea;padding:6px 10px;border-radius:10px;font-weight:600;font-size:15px}
.league{border:2px solid var(--line);border-radius:14px;padding:12px;margin-top:12px}
.lg-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.courts{display:grid;gap:10px;margin-top:8px}
@media(min-width:640px){.courts.c2{grid-template-columns:1fr 1fr}.courts.c3{grid-template-columns:1fr 1fr 1fr}}
.court{background:#fbf4ea;border-radius:12px;padding:8px}
.court h4{margin:2px 4px 6px;font-size:14px}
.match{display:grid;grid-template-columns:22px 1fr 52px 10px 52px 1fr;gap:4px;align-items:center;background:#fff;border-radius:10px;padding:6px;margin-bottom:6px;font-size:15px}
.match .no{font-size:12px;color:var(--muted);text-align:center}
.match .a{text-align:right;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.match .b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.match input{width:52px;padding:6px 2px;text-align:center;font-variant-numeric:tabular-nums}
.match .win{color:var(--green)} .match .lose{color:var(--muted);font-weight:500}
.match.dbl{box-shadow:inset 0 0 0 2px #ffb4b4}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:7px 4px;text-align:center;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:13px}
td.n{text-align:left;font-weight:700}
.medal{font-size:16px}
.scroll{overflow-x:auto}

/* settle */
.settle-row{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;border-bottom:1px dashed var(--line)}
.settle-row b{font-size:17px}
.settle-row .amt{font-size:19px;font-weight:800;color:var(--brand);font-variant-numeric:tabular-nums}
.settle-total{display:flex;justify-content:space-between;padding:12px 4px 4px;font-weight:800;font-size:18px}
.kakao{background:#fee500;color:#191600;width:100%;padding:14px;font-size:17px;margin-top:12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:90vw}
.toast.on{opacity:1}
.notice{background:#fff3e0;border-radius:12px;padding:10px 12px;font-size:14px}
</style>
</head>
<body>
<div class="wrap">

  <!-- 메인 이미지 -->
  <div class="hero" aria-label="우당탕탕 요절복통">
    <svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" role="img">
      <title>우당탕탕 요절복통</title>
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ffcf3c"/><stop offset="1" stop-color="#ff6b35"/>
        </linearGradient>
        <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
          <circle cx="4" cy="4" r="2.2" fill="#fff" opacity=".22"/>
        </pattern>
      </defs>
      <rect width="720" height="300" fill="url(#sky)"/>
      <rect width="720" height="300" fill="url(#dots)"/>
      <!-- 폭발 말풍선 -->
      <polygon fill="#fff" stroke="#2b2118" stroke-width="5" stroke-linejoin="round"
        points="360,22 398,62 452,34 456,86 520,74 494,120 560,140 500,166 536,214 470,206 466,262 420,226 382,278 352,226 300,268 296,214 226,226 254,178 180,156 248,128 214,78 280,92 290,38 330,72"/>
      <text x="370" y="146" text-anchor="middle" font-family="'Black Han Sans','Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="62" font-weight="900" fill="#ff6b35" stroke="#2b2118" stroke-width="3" paint-order="stroke" transform="rotate(-6 370 130)">우당탕탕</text>
      <text x="372" y="214" text-anchor="middle" font-family="'Black Han Sans','Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="56" font-weight="900" fill="#2f7cf6" stroke="#2b2118" stroke-width="3" paint-order="stroke" transform="rotate(4 372 200)">요절복통</text>
      <!-- 셔틀콕 -->
      <g transform="translate(96 90) rotate(-30)">
        <path d="M0 40 L-26 -30 L26 -30 Z" fill="#fff" stroke="#2b2118" stroke-width="4" stroke-linejoin="round"/>
        <path d="M-13 -30 L-4 36 M13 -30 L4 36 M0 -30 L0 36" stroke="#2b2118" stroke-width="2"/>
        <circle cx="0" cy="48" r="14" fill="#e5383b" stroke="#2b2118" stroke-width="4"/>
      </g>
      <path d="M140 150 q20 10 30 30 M150 132 q24 4 40 18" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/>
      <!-- 라켓 -->
      <g transform="translate(628 176) rotate(28)">
        <ellipse cx="0" cy="-50" rx="38" ry="48" fill="none" stroke="#2b2118" stroke-width="7"/>
        <path d="M-26 -82 L26 -18 M-36 -56 L20 -6 M-14 -96 L34 -36 M26 -82 L-26 -18 M36 -56 L-20 -6 M14 -96 L-34 -36" stroke="#2b2118" stroke-width="2" opacity=".5"/>
        <rect x="-5" y="-2" width="10" height="70" rx="4" fill="#2b2118"/>
        <rect x="-8" y="44" width="16" height="34" rx="6" fill="#2f7cf6" stroke="#2b2118" stroke-width="3"/>
      </g>
      <!-- 반짝이 -->
      <g fill="#fff" stroke="#2b2118" stroke-width="3" stroke-linejoin="round">
        <path d="M600 40 l8 18 18 8 -18 8 -8 18 -8 -18 -18 -8 18 -8z"/>
        <path d="M70 230 l6 13 13 6 -13 6 -6 13 -6 -13 -13 -6 13 -6z"/>
      </g>
      <text x="704" y="290" text-anchor="end" font-family="sans-serif" font-size="16" font-weight="700" fill="#2b2118" opacity=".7">진 사람이 낸다!</text>
    </svg>
  </div>

  <!-- 달력 -->
  <section class="card">
    <div class="cal-head">
      <button class="small ghost" id="prevM" aria-label="이전 달">◀</button>
      <b id="monthLabel"></b>
      <button class="small ghost" id="nextM" aria-label="다음 달">▶</button>
    </div>
    <div class="cal" id="cal"></div>
    <p class="muted" style="margin:10px 0 0">오늘 날짜를 눌러 참석자 이름을 넣으세요. 지난 날짜를 누르면 그날 기록을 볼 수 있습니다.</p>
  </section>

  <div id="dayArea" class="hidden">

    <!-- 참석자 -->
    <section class="card">
      <h2>🙋 참석자 <span class="muted" id="dayLabel"></span></h2>
      <form id="addForm" class="row">
        <input id="nameInput" placeholder="이름 입력 (예: 문철)" autocomplete="off" style="flex:1">
        <button class="primary" type="submit">참석</button>
      </form>
      <div class="chips" id="recentChips"></div>
    </section>

    <!-- 자석 보드판 -->
    <section class="card">
      <h2>🧲 자석 보드판</h2>
      <div class="row" style="justify-content:space-between">
        <div class="rate" id="rateBtns">
          <button class="small" data-rate="auto">자동(시간)</button>
          <button class="small" data-rate="2000">7시 전 2,000</button>
          <button class="small" data-rate="3000">7시 후 3,000</button>
        </div>
        <span class="muted" id="rateNow"></span>
      </div>
      <div class="legend">
        <span><i style="background:var(--blue)"></i>2,000원</span>
        <span><i style="background:var(--orange)"></i>3,000원</span>
        <span><i style="background:var(--red)"></i>4,000원</span>
        <span>더블패 = 21점에 10점 미만 / 25점에 13점 미만 (+1,000원)</span>
      </div>
      <div class="board" id="board" style="margin-top:12px"></div>
    </section>

    <!-- 리그 -->
    <section class="card">
      <h2>🎲 랜덤 리그 대진표</h2>
      <div id="leagueSetup">
        <div class="pick" id="leaguePick"></div>
        <div class="row" style="margin:6px 0">
          <button class="small ghost" id="pickAll">전체 선택</button>
          <button class="small ghost" id="pickNone">전체 해제</button>
        </div>
        <div class="grid2">
          <label class="muted">코트 수
            <select id="lgCourts" style="width:100%"><option value="1">1코트</option><option value="2">2코트</option><option value="3">3코트</option></select>
          </label>
          <label class="muted">점수
            <select id="lgTarget" style="width:100%"><option value="21">21점 게임</option><option value="25">25점 게임</option></select>
          </label>
          <label class="muted">1인당 경기 수
            <select id="lgRounds" style="width:100%"></select>
          </label>
          <label class="muted">패배 비용
            <select id="lgFee" style="width:100%"><option value="3000">3,000원</option><option value="2000">2,000원</option><option value="4000">4,000원</option><option value="0">없음</option></select>
          </label>
        </div>
        <button class="primary" id="makeLeague" style="width:100%;margin-top:10px">🎲 랜덤 대진표 만들기</button>
        <p class="muted" style="margin:8px 0 0">모두 한 번씩 붙는 리그(4명이면 각자 3경기)를 무작위로 만듭니다. 사람이 많으면 코트를 2개로 나누고, 1인당 경기 수를 줄일 수 있습니다. 점수를 넣으면 진 사람에게 비용이 자동으로 붙습니다.</p>
      </div>
      <div id="leagues"></div>
    </section>

    <!-- 정산 -->
    <section class="card">
      <h2>💰 오늘 정산</h2>
      <div id="settle"></div>
      <div class="row" style="margin-top:12px">
        <input id="account" placeholder="입금 계좌 (예: 카카오뱅크 3333-00-0000000 홍길동)" style="flex:1">
      </div>
      <button class="kakao" id="shareBtn">💬 카카오톡으로 결과 공유</button>
      <div class="row" style="margin-top:8px">
        <button class="small ghost" id="copyBtn" style="flex:1">📋 결과 복사</button>
        <button class="small ghost" id="resetDay" style="flex:1;color:var(--red)">이 날짜 기록 지우기</button>
      </div>
    </section>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
'use strict';
const KEY = 'wdtt-v1';
const $ = s => document.querySelector(s);
const won = n => n.toLocaleString('ko-KR') + '원';
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
// 더블패 기준: 이 점수 미만이면 +1,000원
const DBL_LINE = { 21: 10, 25: 13 };

function load() {
  try { const v = JSON.parse(localStorage.getItem(KEY)); if (v && v.days) return v; } catch (e) {}
  return { days: {}, roster: [], rate: 'auto', account: '' };
}
let db = load();
function save() { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} }

const today = ymd(new Date());
let view = new Date(); view.setDate(1);
let selDate = null;

function day(d = selDate) {
  if (!db.days[d]) db.days[d] = { players: [], marks: [], leagues: [] };
  return db.days[d];
}
function hasDay(d) { const x = db.days[d]; return x && x.players.length; }

/* ---------- 달력 ---------- */
function renderCal() {
  const y = view.getFullYear(), m = view.getMonth();
  $('#monthLabel').textContent = `${y}년 ${m + 1}월`;
  const first = new Date(y, m, 1).getDay();
  const last = new Date(y, m + 1, 0).getDate();
  let h = '일월화수목금토'.split('').map(c => `<div class="dow">${c}</div>`).join('');
  for (let i = 0; i < first; i++) h += '<div class="day empty"></div>';
  for (let d = 1; d <= last; d++) {
    const key = `${y}-${pad(m + 1)}-${pad(d)}`;
    const dow = (first + d - 1) % 7;
    const cls = ['day'];
    if (key === today) cls.push('today');
    if (key === selDate) cls.push('sel');
    if (dow === 0) cls.push('sun'); if (dow === 6) cls.push('sat');
    const n = hasDay(key) ? db.days[key].players.length : 0;
    h += `<button class="${cls.join(' ')}" data-date="${key}">${d}${n ? `<span class="cnt">${n}명</span>` : ''}</button>`;
  }
  $('#cal').innerHTML = h;
}
$('#cal').addEventListener('click', e => {
  const b = e.target.closest('[data-date]'); if (!b) return;
  openDay(b.dataset.date);
});
$('#prevM').onclick = () => { view.setMonth(view.getMonth() - 1); renderCal(); };
$('#nextM').onclick = () => { view.setMonth(view.getMonth() + 1); renderCal(); };

function openDay(d) {
  selDate = d;
  $('#dayArea').classList.remove('hidden');
  const [y, m, dd] = d.split('-');
  $('#dayLabel').textContent = `${+m}월 ${+dd}일${d === today ? ' (오늘)' : ''}`;
  renderAll();
  if (d === today) setTimeout(() => $('#nameInput').focus(), 50);
  $('#dayArea').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* ---------- 참석자 ---------- */
$('#addForm').addEventListener('submit', e => {
  e.preventDefault();
  const names = $('#nameInput').value.split(/[,\s]+/).map(s => s.trim()).filter(Boolean);
  names.forEach(addPlayer);
  $('#nameInput').value = '';
  renderAll();
});
function addPlayer(name) {
  const D = day();
  if (D.players.includes(name)) { toast(`${name}님은 이미 참석`); return; }
  D.players.push(name);
  db.roster = [name, ...db.roster.filter(n => n !== name)].slice(0, 40);
  save();
}
$('#recentChips').addEventListener('click', e => {
  const b = e.target.closest('[data-name]'); if (!b) return;
  addPlayer(b.dataset.name); renderAll();
});
function renderChips() {
  const D = day();
  const list = db.roster.filter(n => !D.players.includes(n));
  $('#recentChips').innerHTML = list.length
    ? '<span class="muted" style="width:100%">자주 오는 사람 (눌러서 추가)</span>' + list.map(n => `<button class="chip" data-name="${esc(n)}">+ ${esc(n)}</button>`).join('')
    : '';
}

/* ---------- 비용 계산 ---------- */
function currentRate() {
  if (db.rate === '2000') return 2000;
  if (db.rate === '3000') return 3000;
  return new Date().getHours() >= 19 ? 3000 : 2000;
}
// 보드에서 누른 패 + 리그 결과에서 나온 패를 합친 목록
function charges(D = day()) {
  const out = D.marks.map(m => ({ ...m, src: 'board' }));
  D.leagues.forEach((L, li) => L.matches.forEach(mt => {
    const r = result(mt, L.target);
    if (!r || !L.fee) return;
    out.push({ name: r.loser, amount: L.fee + (r.dbl ? 1000 : 0), dbl: r.dbl, src: 'league', label: `리그${li + 1}` });
  }));
  return out;
}
function totals(D = day()) {
  const t = {};
  D.players.forEach(p => t[p] = { amount: 0, count: 0, board: 0, league: 0 });
  charges(D).forEach(c => {
    if (!t[c.name]) t[c.name] = { amount: 0, count: 0, board: 0, league: 0 };
    t[c.name].amount += c.amount; t[c.name].count++; t[c.name][c.src]++;
  });
  return t;
}

/* ---------- 바를 정(正) ---------- */
const STROKES = [
  'M6 7 H34', 'M20 7 V33', 'M20 20 H31', 'M10 18 V33', 'M4 33 H36'
];
const color = a => a >= 4000 ? 'var(--red)' : a >= 3000 ? 'var(--orange)' : 'var(--blue)';
function tallySvg(list) {
  if (!list.length) return '<span class="none">아직 깨끗! ✨</span>';
  let h = '';
  for (let i = 0; i < list.length; i += 5) {
    const grp = list.slice(i, i + 5);
    h += '<svg viewBox="0 0 40 40" aria-hidden="true">' + grp.map((c, k) =>
      `<path d="${STROKES[k]}" stroke="${color(c.amount)}" stroke-width="4.5" stroke-linecap="round" fill="none"/>`
    ).join('') + '</svg>';
  }
  return h;
}

function renderRate() {
  document.querySelectorAll('#rateBtns button').forEach(b => b.classList.toggle('on', b.dataset.rate === (db.rate || 'auto')));
  const r = currentRate();
  $('#rateNow').textContent = `지금 1패 = ${won(r)} · 더블패 = ${won(r + 1000)}`;
}
$('#rateBtns').addEventListener('click', e => {
  const b = e.target.closest('[data-rate]'); if (!b) return;
  db.rate = b.dataset.rate; save(); renderAll();
});

function renderBoard() {
  const D = day(), all = charges(D), t = totals(D);
  const r = currentRate();
  if (!D.players.length) { $('#board').innerHTML = '<p class="muted">참석자를 먼저 넣어 주세요.</p>'; return; }
  $('#board').innerHTML = D.players.map(p => {
    const mine = all.filter(c => c.name === p);
    const lg = t[p].league;
    return `<div class="pl">
      <div class="pl-top">
        <span class="pl-name">${esc(p)}</span>
        <span class="pl-sum">${t[p].count}패 · ${won(t[p].amount)}</span>
      </div>
      <div class="tally">${tallySvg(mine)}</div>
      ${lg ? `<div class="muted" style="margin:-4px 0 6px">리그 패 ${lg}개 포함</div>` : ''}
      <div class="pl-btns">
        <button class="lose" data-act="lose" data-p="${esc(p)}">패 +${(r / 1000)}천</button>
        <button class="dbl" data-act="dbl" data-p="${esc(p)}">더블패 +${((r + 1000) / 1000)}천</button>
        <button class="small ghost" data-act="undo" data-p="${esc(p)}" title="마지막 표시 지우기">↶</button>
      </div>
    </div>`;
  }).join('') + `<div class="row"><button class="small ghost" id="editPlayers">참석자 빼기…</button></div>`;
}
$('#board').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const D = day();
  if (b.id === 'editPlayers') {
    const n = prompt('뺄 사람 이름을 입력하세요\n(' + D.players.join(', ') + ')');
    if (n && D.players.includes(n.trim())) {
      const name = n.trim();
      if (!confirm(`${name}님을 빼면 보드판 기록도 함께 지워집니다. 계속할까요?`)) return;
      D.players = D.players.filter(x => x !== name);
      D.marks = D.marks.filter(m => m.name !== name);
      save(); renderAll();
    }
    return;
  }
  const p = b.dataset.p, act = b.dataset.act;
  if (!p) return;
  const r = currentRate();
  if (act === 'lose') D.marks.push({ id: uid(), name: p, amount: r, dbl: false, at: Date.now() });
  if (act === 'dbl') D.marks.push({ id: uid(), name: p, amount: r + 1000, dbl: true, at: Date.now() });
  if (act === 'undo') {
    let i = -1; D.marks.forEach((m, k) => { if (m.name === p) i = k; });
    if (i < 0) { toast('지울 보드 표시가 없어요 (리그 패는 점수를 지우세요)'); return; }
    D.marks.splice(i, 1);
  }
  save(); renderAll();
  if (act !== 'undo') toast(`${p} +${won(act === 'dbl' ? r + 1000 : r)}`);
});

/* ---------- 리그 ---------- */
function shuffle(a) { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
// 원형 방식 라운드로빈: 한 라운드에 한 사람이 최대 한 경기
function roundRobin(list) {
  const a = [...list]; if (a.length % 2) a.push(null);
  const n = a.length, rounds = [];
  for (let r = 0; r < n - 1; r++) {
    const pairs = [];
    for (let i = 0; i < n / 2; i++) { const p = a[i], q = a[n - 1 - i]; if (p && q) pairs.push(Math.random() < .5 ? [p, q] : [q, p]); }
    rounds.push(shuffle(pairs));
    a.splice(1, 0, a.pop());
  }
  return shuffle(rounds);
}
const unpicked = new Set(); // 리그에서 뺀 사람 (새 참석자는 자동 선택)
function pickedNames() { return [...document.querySelectorAll('#leaguePick input:checked')].map(i => i.value); }
function renderPick() {
  const D = day();
  $('#leaguePick').innerHTML = D.players.length
    ? D.players.map(p => `<label><input type="checkbox" value="${esc(p)}" ${unpicked.has(p) ? '' : 'checked'}> ${esc(p)}</label>`).join('')
    : '<span class="muted">참석자를 먼저 넣어 주세요.</span>';
  renderRoundsOpt();
}
function renderRoundsOpt() {
  const n = pickedNames().length;
  const games = n - 1; // 모두 한 번씩이면 각자 n-1경기
  const old = $('#lgRounds').value;
  let h = `<option value="all">모두 한 번씩 (각 ${Math.max(games, 0)}경기)</option>`;
  for (let k = 1; k < Math.max(games, 1); k++) h += `<option value="${k}">약 ${k}경기씩</option>`;
  $('#lgRounds').innerHTML = h;
  if ([...$('#lgRounds').options].some(o => o.value === old)) $('#lgRounds').value = old;
  if (n >= 10 && $('#lgCourts').value === '1' && !$('#lgCourts').dataset.touched) $('#lgCourts').value = '2';
}
function syncUnpicked() { document.querySelectorAll('#leaguePick input').forEach(i => i.checked ? unpicked.delete(i.value) : unpicked.add(i.value)); renderRoundsOpt(); }
$('#leaguePick').addEventListener('change', syncUnpicked);
$('#lgCourts').addEventListener('change', () => $('#lgCourts').dataset.touched = '1');
$('#pickAll').onclick = () => { document.querySelectorAll('#leaguePick input').forEach(i => i.checked = true); syncUnpicked(); };
$('#pickNone').onclick = () => { document.querySelectorAll('#leaguePick input').forEach(i => i.checked = false); syncUnpicked(); };

$('#makeLeague').onclick = () => {
  const names = pickedNames();
  if (names.length < 2) { toast('2명 이상 선택하세요'); return; }
  const courts = +$('#lgCourts').value, target = +$('#lgTarget').value, fee = +$('#lgFee').value;
  let rounds = roundRobin(shuffle(names));
  const rv = $('#lgRounds').value;
  if (rv !== 'all') {
    // 홀수 인원은 매 라운드 1명이 쉬므로 라운드를 하나 더 써서 경기 수를 맞춤
    const k = +rv + (names.length % 2 ? 1 : 0);
    rounds = rounds.slice(0, k);
  }
  const matches = []; let no = 0;
  rounds.forEach((pairs, ri) => pairs.forEach(([a, b]) => {
    matches.push({ id: uid(), a, b, sa: '', sb: '', round: ri + 1, court: (no % courts) + 1, no: ++no });
  }));
  day().leagues.push({ id: uid(), courts, target, fee, players: names, matches, at: Date.now() });
  save(); renderAll();
  toast(`${matches.length}경기 대진표 완성!`);
  setTimeout(() => document.querySelector('#leagues .league:last-child')?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 60);
};

function result(mt, target) {
  if (mt.sa === '' || mt.sb === '' || mt.sa == null || mt.sb == null) return null;
  const a = +mt.sa, b = +mt.sb;
  if (!Number.isFinite(a) || !Number.isFinite(b) || a === b) return null;
  const winner = a > b ? mt.a : mt.b, loser = a > b ? mt.b : mt.a;
  const ls = Math.min(a, b);
  const line = DBL_LINE[target] ?? Math.ceil(target / 2);
  return { winner, loser, ws: Math.max(a, b), ls, dbl: ls < line };
}

// 순위: 득실차 → 동률이면 승자승(동률자끼리 승수 → 동률자끼리 득실) → 득점 → 승수
function standings(L) {
  const s = {};
  L.players.forEach(p => s[p] = { name: p, g: 0, w: 0, l: 0, pf: 0, pa: 0 });
  const done = [];
  L.matches.forEach(mt => {
    const r = result(mt, L.target); if (!r) return;
    done.push(mt);
    const a = +mt.sa, b = +mt.sb;
    [[mt.a, a, b], [mt.b, b, a]].forEach(([p, f, ag]) => { if (!s[p]) return; s[p].g++; s[p].pf += f; s[p].pa += ag; });
    s[r.winner].w++; s[r.loser].l++;
  });
  const arr = Object.values(s).map(x => ({ ...x, diff: x.pf - x.pa }));
  arr.sort((x, y) => y.diff - x.diff);
  // 득실차 같은 그룹끼리 승자승 적용
  const out = [];
  for (let i = 0; i < arr.length;) {
    let j = i; while (j < arr.length && arr[j].diff === arr[i].diff) j++;
    const grp = arr.slice(i, j);
    if (grp.length > 1) {
      const names = new Set(grp.map(g => g.name));
      const h = {}; grp.forEach(g => h[g.name] = { w: 0, d: 0 });
      done.forEach(mt => {
        if (!names.has(mt.a) || !names.has(mt.b)) return;
        const a = +mt.sa, b = +mt.sb;
        h[a > b ? mt.a : mt.b].w++;
        h[mt.a].d += a - b; h[mt.b].d += b - a;
      });
      grp.forEach(g => { g.hw = h[g.name].w; g.hd = h[g.name].d; });
      grp.sort((x, y) => y.hw - x.hw || y.hd - x.hd || y.pf - x.pf || y.w - x.w);
    }
    out.push(...grp); i = j;
  }
  // 완전히 같은 기록은 같은 순위
  let rank = 0;
  out.forEach((x, k) => {
    const p = out[k - 1];
    const same = p && p.diff === x.diff && p.hw === x.hw && p.hd === x.hd && p.pf === x.pf && p.w === x.w;
    x.rank = same ? p.rank : (rank = k + 1);
  });
  return { rows: out, played: done.length };
}

function standingsHtml(L) {
  const st = standings(L);
  const medals = ['🥇', '🥈', '🥉'];
  const lastRank = st.rows.length ? st.rows[st.rows.length - 1].rank : 0;
  return `<h3>🏆 순위 <span class="muted">(${st.played}/${L.matches.length}경기 완료)</span></h3>
      <div class="scroll"><table>
        <tr><th>순위</th><th style="text-align:left">이름</th><th>경기</th><th>승</th><th>패</th><th>득</th><th>실</th><th>득실</th></tr>
        ${st.rows.map(x => `<tr>
          <td>${st.played ? (x.rank <= 3 ? `<span class="medal">${medals[x.rank - 1]}</span>` : (x.rank === lastRank && st.rows.length > 3 ? '💀' : x.rank)) : '-'}</td>
          <td class="n">${esc(x.name)}</td><td>${x.g}</td><td>${x.w}</td><td>${x.l}</td><td>${x.pf}</td><td>${x.pa}</td>
          <td style="font-weight:700;color:${x.diff > 0 ? 'var(--green)' : x.diff < 0 ? 'var(--red)' : 'inherit'}">${x.diff > 0 ? '+' : ''}${x.diff}</td>
        </tr>`).join('')}
      </table></div>`;
}
function renderLeagues() {
  const D = day();
  $('#leagues').innerHTML = D.leagues.map((L, li) => {
    const byCourt = Array.from({ length: L.courts }, () => []);
    L.matches.forEach(mt => byCourt[mt.court - 1].push(mt));
    return `<div class="league" data-li="${li}">
      <div class="lg-head">
        <b>리그 ${li + 1} · ${L.players.length}명 · ${L.matches.length}경기</b>
        <span class="muted">${L.target}점 · 패 ${L.fee ? won(L.fee) : '무료'} · 더블패 ${DBL_LINE[L.target]}점 미만</span>
      </div>
      <div class="courts c${L.courts}">
        ${byCourt.map((list, ci) => `<div class="court">
          ${L.courts > 1 ? `<h4>🏸 ${ci + 1}코트</h4>` : ''}
          ${list.map(mt => {
            const r = result(mt, L.target);
            const ca = r ? (r.winner === mt.a ? 'win' : 'lose') : '', cb = r ? (r.winner === mt.b ? 'win' : 'lose') : '';
            return `<div class="match${r && r.dbl ? ' dbl' : ''}" id="m-${mt.id}">
              <span class="no">${mt.no}</span>
              <span class="a ${ca}">${esc(mt.a)}</span>
              <input inputmode="numeric" pattern="[0-9]*" data-mid="${mt.id}" data-side="sa" value="${esc(mt.sa)}" aria-label="${esc(mt.a)} 점수">
              <span style="text-align:center">:</span>
              <input inputmode="numeric" pattern="[0-9]*" data-mid="${mt.id}" data-side="sb" value="${esc(mt.sb)}" aria-label="${esc(mt.b)} 점수">
              <span class="b ${cb}">${esc(mt.b)}</span>
            </div>`;
          }).join('')}
        </div>`).join('')}
      </div>
      <div id="st-${L.id}">${standingsHtml(L)}</div>
      <p class="muted" style="margin:6px 0 0">득실차 순으로 순위를 매기고, 같으면 승자승(맞대결)으로 정합니다.</p>
      <div class="row" style="margin-top:8px;justify-content:flex-end">
        <button class="small ghost" data-del="${li}" style="color:var(--red)">이 리그 삭제</button>
      </div>
    </div>`;
  }).join('');
}
// 점수 입력: 다시 그리지 않고 저장 후 해당 부분만 갱신 (입력 포커스 유지)
$('#leagues').addEventListener('input', e => {
  const i = e.target.closest('input[data-mid]'); if (!i) return;
  i.value = i.value.replace(/\D/g, '').slice(0, 2);
  const D = day();
  D.leagues.forEach(L => L.matches.forEach(mt => {
    if (mt.id !== i.dataset.mid) return;
    mt[i.dataset.side] = i.value;
    // 이 경기 줄과 순위표만 갱신
    const r = result(mt, L.target), row = document.getElementById('m-' + mt.id);
    row.classList.toggle('dbl', !!(r && r.dbl));
    row.querySelector('.a').className = 'a ' + (r ? (r.winner === mt.a ? 'win' : 'lose') : '');
    row.querySelector('.b').className = 'b ' + (r ? (r.winner === mt.b ? 'win' : 'lose') : '');
    document.getElementById('st-' + L.id).innerHTML = standingsHtml(L);
  }));
  save();
  renderBoard(); renderSettle();
});
$('#leagues').addEventListener('click', e => {
  const b = e.target.closest('[data-del]'); if (!b) return;
  if (!confirm('이 리그를 삭제할까요? 리그에서 붙은 비용도 빠집니다.')) return;
  day().leagues.splice(+b.dataset.del, 1); save(); renderAll();
});

/* ---------- 정산 & 공유 ---------- */
function renderSettle() {
  const D = day(), t = totals(D);
  const names = Object.keys(t).sort((a, b) => t[b].amount - t[a].amount);
  const sum = names.reduce((s, n) => s + t[n].amount, 0);
  $('#settle').innerHTML = names.length ? names.map(n => `<div class="settle-row">
      <div><b>${esc(n)}</b> <span class="muted">${t[n].count}패${t[n].league ? ` (리그 ${t[n].league})` : ''}</span></div>
      <span class="amt">${t[n].amount ? won(t[n].amount) : '0원 🎉'}</span>
    </div>`).join('') + `<div class="settle-total"><span>합계</span><span>${won(sum)}</span></div>`
    : '<p class="muted">참석자가 없습니다.</p>';
  $('#account').value = db.account || '';
}
$('#account').addEventListener('input', e => { db.account = e.target.value; save(); });

function shareText() {
  const D = day(), t = totals(D);
  const [y, m, d] = selDate.split('-');
  const names = Object.keys(t).sort((a, b) => t[b].amount - t[a].amount);
  const sum = names.reduce((s, n) => s + t[n].amount, 0);
  let s = `🏸 우당탕탕 요절복통\n${y}.${m}.${d} 정산 (참석 ${D.players.length}명)\n\n`;
  s += names.map(n => `${n} : ${t[n].amount ? won(t[n].amount) + ' 입금' : '0원 🎉'} (${t[n].count}패)`).join('\n');
  s += `\n\n합계 ${won(sum)}`;
  D.leagues.forEach((L, li) => {
    const st = standings(L); if (!st.played) return;
    s += `\n\n🏆 리그${D.leagues.length > 1 ? ' ' + (li + 1) : ''} 순위\n` + st.rows.map(x => `${x.rank}. ${x.name} (${x.w}승${x.l}패 득실${x.diff > 0 ? '+' : ''}${x.diff})`).join('\n');
  });
  if (db.account) s += `\n\n💳 ${db.account}`;
  return s;
}
async function copy(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (_) {}
    ta.remove(); return ok;
  }
}
$('#shareBtn').onclick = async () => {
  const text = shareText();
  if (navigator.share) {
    try { await navigator.share({ title: '우당탕탕 요절복통 정산', text }); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  if (await copy(text)) toast('결과를 복사했어요. 카카오톡 단톡방에 붙여넣기 하세요!');
  else alert(text);
};
$('#copyBtn').onclick = async () => { toast(await copy(shareText()) ? '복사 완료!' : '복사 실패'); };
$('#resetDay').onclick = () => {
  if (!confirm(`${selDate} 기록(참석자, 보드, 리그)을 모두 지울까요?`)) return;
  delete db.days[selDate]; save(); renderAll();
};

/* ---------- 공통 ---------- */
let tt;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2200); }
function renderAll() {
  renderCal();
  if (!selDate) return;
  renderChips(); renderRate(); renderBoard(); renderPick(); renderLeagues(); renderSettle();
}
// 7시가 지나면 요금 표시 갱신
setInterval(() => { if (selDate) renderRate(); }, 60000);

renderCal();
openDay(today);
window.scrollTo(0, 0);
})();
</script>
